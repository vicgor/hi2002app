[project]
name = "hi2002app"
version = "0.1.0"
description = "Desktop application for Hanna Instruments HI2002 pH meter"
authors = [{name = "Victor Goryachko", email = "vicgor@gmail.com"}]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.dependencies]
PySide6 = ">=6.7"
pyserial = ">=3.5"
numpy = ">=1.26"
pandas = ">=2.2"
openpyxl = ">=3.1"
reportlab = ">=4.1"
pyqtgraph = ">=0.13"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.6",
]

[project.scripts]
hi2002app = "hi2002app.__main__:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "pyqtgraph.*",
    "serial.*",
    "openpyxl.*",
    "reportlab.*",
    "pandas.*",
    "numpy.*",
]
ignore_missing_imports = true
